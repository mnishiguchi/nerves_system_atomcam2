<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">nerves_system_atomcam2 のアーキテクチャ概要</title>
  <desc id="description">Atom Cam 2 の既存ブートコンポーネントから Nerves ブートマネージャーへ処理を引き継ぎ、A/B アプリケーションスロット、永続データ、ネットワーク、任意のカメラおよび NAS サービスを管理する構成図。</desc>
  <!-- Keep architectural labels synchronized with docs/architecture.md. -->

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#f7f5fb"/>
    </linearGradient>
    <linearGradient id="nerves-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f42a3"/>
      <stop offset="1" stop-color="#4d286f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#172033" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#3567b7"/>
    </marker>
    <marker id="arrow-purple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#6f42a3"/>
    </marker>
    <style>
      .base { font-family: "TakaoGothic", "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif; fill: #172033; }
      .heading { font-size: 30px; font-weight: 700; letter-spacing: .4px; }
      .subtitle { font-size: 15px; fill: #536075; }
      .section { font-size: 17px; font-weight: 700; }
      .label { font-size: 15px; font-weight: 650; }
      .small { font-size: 13px; fill: #536075; }
      .micro { font-size: 12px; fill: #536075; }
      .white { fill: #ffffff; }
      .card { fill: #ffffff; stroke: #d5deeb; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1280" height="720" rx="24" fill="url(#background)"/>

  <g class="base">
    <text x="640" y="48" text-anchor="middle" class="heading">Atom Cam 2 × Nerves</text>
    <text x="640" y="75" text-anchor="middle" class="subtitle">ハードウェア固有の起動基盤を活かし、更新可能で復旧しやすい Elixir システムを構築</text>

    <!-- Existing vendor components -->
    <g filter="url(#shadow)">
      <rect x="38" y="112" width="250" height="416" rx="18" class="card"/>
    </g>
    <rect x="38" y="112" width="250" height="55" rx="18" fill="#eaf2ff"/>
    <path d="M38 149 H288 V167 H38 Z" fill="#eaf2ff"/>
    <text x="163" y="143" text-anchor="middle" class="section" fill="#24569f">既存コンポーネント</text>
    <text x="163" y="190" text-anchor="middle" class="small">Atom Cam 2 ハードウェア</text>

    <g>
      <rect x="63" y="210" width="200" height="62" rx="12" fill="#f5f8fd" stroke="#8daee0"/>
      <circle cx="89" cy="241" r="13" fill="#dce9fb"/>
      <path d="M82 241h14M89 234v14" stroke="#3567b7" stroke-width="2" stroke-linecap="round"/>
      <text x="111" y="238" class="label">U-Boot</text>
      <text x="111" y="257" class="micro">電源投入と初期化</text>
    </g>

    <g>
      <rect x="63" y="286" width="200" height="76" rx="12" fill="#f5f8fd" stroke="#8daee0"/>
      <path d="M79 321h20v18H79z M82 317h14l3 4H79z" fill="#dce9fb" stroke="#3567b7" stroke-width="1.5"/>
      <text x="111" y="316" class="label">制御カーネル</text>
      <text x="111" y="338" class="label">＋ initramfs</text>
      <text x="111" y="355" class="micro">保護して継続利用</text>
    </g>

    <g>
      <rect x="63" y="376" width="200" height="62" rx="12" fill="#f5f8fd" stroke="#8daee0"/>
      <path d="M78 408c7-8 17-8 24 0M82 413c5-5 11-5 16 0M88 418c1-1 3-1 4 0" fill="none" stroke="#3567b7" stroke-width="2.4" stroke-linecap="round"/>
      <text x="111" y="405" class="label">Wi-Fi ドライバー</text>
      <text x="111" y="424" class="micro">ハードウェア固有</text>
    </g>

    <rect x="63" y="460" width="200" height="42" rx="10" fill="#fff7e8" stroke="#e7ae46"/>
    <path d="M80 473h17v15H80z M83 470h11l3 3H80z" fill="#f7d38c"/>
    <text x="111" y="486" class="small" fill="#805609">リモート更新では保持</text>

    <!-- Handoff -->
    <path d="M298 320 H344" fill="none" stroke="#3567b7" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <text x="321" y="304" text-anchor="middle" class="micro" fill="#24569f">引き継ぎ</text>

    <!-- Nerves-managed core -->
    <g filter="url(#shadow)">
      <rect x="354" y="112" width="552" height="416" rx="18" class="card"/>
    </g>
    <rect x="354" y="112" width="552" height="55" rx="18" fill="#ebf7ef"/>
    <path d="M354 149 H906 V167 H354 Z" fill="#ebf7ef"/>
    <text x="630" y="143" text-anchor="middle" class="section" fill="#267542">nerves_system_atomcam2 が管理</text>

    <rect x="390" y="190" width="480" height="62" rx="13" fill="#eef9f1" stroke="#72b686" stroke-width="1.5"/>
    <circle cx="422" cy="221" r="15" fill="#d5efdd"/>
    <path d="M422 210v5M422 227v5M411 221h5M428 221h5M414 213l4 4M426 225l4 4M430 213l-4 4M418 225l-4 4" stroke="#267542" stroke-width="2" stroke-linecap="round"/>
    <text x="450" y="218" class="label">Nerves ブートマネージャー</text>
    <text x="450" y="238" class="small">更新メタデータを検証し、起動スロットを選択</text>

    <path d="M630 252 V278" fill="none" stroke="#6f42a3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>

    <g>
      <rect x="390" y="286" width="224" height="104" rx="14" fill="#f5f0fa" stroke="#a480c1" stroke-width="1.5"/>
      <rect x="408" y="303" width="34" height="34" rx="8" fill="#6f42a3"/>
      <text x="425" y="327" text-anchor="middle" class="label white">A</text>
      <text x="454" y="317" class="label">アプリスロット A</text>
      <text x="454" y="339" class="small">読み取り専用</text>
      <rect x="408" y="354" width="178" height="22" rx="11" fill="#e6f4ea"/>
      <text x="497" y="370" text-anchor="middle" class="micro" fill="#267542">実行中または確認済み</text>
    </g>

    <g>
      <rect x="646" y="286" width="224" height="104" rx="14" fill="#f5f0fa" stroke="#a480c1" stroke-width="1.5"/>
      <rect x="664" y="303" width="34" height="34" rx="8" fill="#6f42a3"/>
      <text x="681" y="327" text-anchor="middle" class="label white">B</text>
      <text x="710" y="317" class="label">アプリスロット B</text>
      <text x="710" y="339" class="small">読み取り専用</text>
      <rect x="664" y="354" width="178" height="22" rx="11" fill="#fff1dc"/>
      <text x="753" y="370" text-anchor="middle" class="micro" fill="#8a5a08">非アクティブ側を更新</text>
    </g>

    <rect x="476" y="407" width="308" height="36" rx="18" fill="#f5f0fa"/>
    <rect x="487" y="416" width="15" height="18" rx="4" fill="#6f42a3"/>
    <text x="494.5" y="429" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">A</text>
    <rect x="513" y="416" width="15" height="18" rx="4" fill="#ffffff" stroke="#6f42a3" stroke-width="1.5"/>
    <text x="520.5" y="429" text-anchor="middle" font-size="9" font-weight="700" fill="#6f42a3">B</text>
    <path d="M504 419h7M508 417l3 2-3 2M511 431h-7M507 429l-3 2 3 2" fill="none" stroke="#3567b7" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="536" y="430" class="micro" fill="#5c3286">候補を試行 → 確認、失敗時はロールバック</text>

    <rect x="390" y="462" width="480" height="42" rx="12" fill="url(#nerves-card)"/>
    <text x="630" y="489" text-anchor="middle" class="label white">Erlang VM ＋ Elixir アプリケーション</text>

    <!-- Runtime services -->
    <path d="M916 320 H952" fill="none" stroke="#6f42a3" stroke-width="3" marker-end="url(#arrow-purple)"/>
    <g filter="url(#shadow)">
      <rect x="962" y="112" width="280" height="416" rx="18" class="card"/>
    </g>
    <rect x="962" y="112" width="280" height="55" rx="18" fill="#f1ebf8"/>
    <path d="M962 149 H1242 V167 H962 Z" fill="#f1ebf8"/>
    <text x="1102" y="143" text-anchor="middle" class="section" fill="#5c3286">実行時サービス</text>

    <rect x="987" y="190" width="230" height="76" rx="12" fill="#eef9f1" stroke="#72b686"/>
    <circle cx="1015" cy="218" r="12" fill="none" stroke="#267542" stroke-width="2"/>
    <path d="M1003 218h24M1015 206c5 6 5 18 0 24M1015 206c-5 6-5 18 0 24" fill="none" stroke="#267542" stroke-width="1.5"/>
    <text x="1040" y="215" class="label">ネットワークと保守</text>
    <text x="1040" y="237" class="small">Wi-Fi・mDNS・SSH</text>
    <text x="1040" y="255" class="micro">Nerves が常時管理</text>

    <rect x="987" y="282" width="230" height="88" rx="12" fill="#f5f0fa" stroke="#a480c1"/>
    <rect x="1002" y="303" width="26" height="20" rx="4" fill="none" stroke="#6f42a3" stroke-width="2"/>
    <circle cx="1015" cy="313" r="5" fill="none" stroke="#6f42a3" stroke-width="2"/>
    <path d="M1028 307l7-5v22l-7-5" fill="#d9c9e8" stroke="#6f42a3" stroke-width="1.5"/>
    <text x="1046" y="311" class="label">カメラ互換機能</text>
    <text x="1046" y="334" class="small">分離した環境で実行</text>
    <text x="1046" y="354" class="micro" fill="#6f42a3">任意で有効化</text>

    <rect x="987" y="386" width="230" height="92" rx="12" fill="#fff7e8" stroke="#e7ae46"/>
    <path d="M1003 410h24v18h-24z M1007 406h8l4 4h8" fill="none" stroke="#b57612" stroke-width="2" stroke-linejoin="round"/>
    <path d="M1015 438h16M1026 433l5 5-5 5" fill="none" stroke="#b57612" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1046" y="416" class="label">録画と NAS 転送</text>
    <text x="1046" y="439" class="small">ローカル spool → SFTP</text>
    <text x="1046" y="459" class="micro" fill="#8a5a08">任意・失敗時は再試行</text>

    <!-- Storage layout -->
    <g filter="url(#shadow)">
      <rect x="38" y="560" width="1204" height="122" rx="18" class="card"/>
    </g>
    <text x="66" y="593" class="section" fill="#39465a">MicroSD</text>
    <text x="66" y="617" class="small">安全な更新境界</text>

    <rect x="190" y="584" width="148" height="66" rx="10" fill="#fff7e8" stroke="#e7ae46"/>
    <text x="264" y="608" text-anchor="middle" class="label">パーティション前</text>
    <text x="264" y="630" text-anchor="middle" class="micro">A/B 更新メタデータ</text>

    <rect x="348" y="584" width="148" height="66" rx="10" fill="#eaf2ff" stroke="#8daee0"/>
    <text x="422" y="608" text-anchor="middle" class="label">パーティション 1</text>
    <text x="422" y="630" text-anchor="middle" class="micro">FAT・起動と設定</text>

    <rect x="506" y="584" width="148" height="66" rx="10" fill="#f5f0fa" stroke="#a480c1"/>
    <text x="580" y="608" text-anchor="middle" class="label">パーティション 2</text>
    <text x="580" y="630" text-anchor="middle" class="micro">アプリスロット A</text>

    <rect x="664" y="584" width="148" height="66" rx="10" fill="#f5f0fa" stroke="#a480c1"/>
    <text x="738" y="608" text-anchor="middle" class="label">パーティション 3</text>
    <text x="738" y="630" text-anchor="middle" class="micro">アプリスロット B</text>

    <rect x="822" y="584" width="148" height="66" rx="10" fill="#fff7e8" stroke="#e7ae46"/>
    <text x="896" y="608" text-anchor="middle" class="label">パーティション 4</text>
    <text x="896" y="630" text-anchor="middle" class="micro">/data・永続データ</text>

    <path d="M991 599h18v18h-18z M995 595h10l4 4h-18z" fill="#d5efdd" stroke="#267542" stroke-width="1.5"/>
    <text x="1020" y="610" class="small" fill="#267542">更新時も設定と</text>
    <text x="1020" y="631" class="small" fill="#267542">データを保持</text>

    <text x="640" y="672" text-anchor="middle" class="micro">通常のリモート更新は非アクティブなアプリスロットと更新メタデータだけを書き換えます</text>
  </g>
</svg>
