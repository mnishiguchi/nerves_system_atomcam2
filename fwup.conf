# Atom Cam 2 firmware packaging.
#
# The MicroSD layout contains:
#
# - partition 1: FAT boot and provisioning filesystem
# - partition 2: Linux application-data partition
#
# The protected initramfs mounts partition 1 and switch_roots into the
# squashfs image. Partition 2 is reserved for target-side initialization
# and mounting.

require-fwup-version="1.0.0"

define(NERVES_FW_PRODUCT, "Nerves Firmware")
define(NERVES_FW_DESCRIPTION, "Atom Cam 2 Nerves firmware")
define(NERVES_FW_VERSION, "${NERVES_SDK_VERSION}")
define(NERVES_FW_PLATFORM, "atomcam2")
define(NERVES_FW_ARCHITECTURE, "mipsel")
define(NERVES_FW_AUTHOR, "nerves_system_atomcam2")

define(ROOTFS, "${NERVES_SYSTEM}/images/rootfs.squashfs")

# Partition sizes use 512-byte blocks.
#
# Keep 512 MiB for the vendor kernel, Nerves squashfs, and provisioning files.
# The data partition starts immediately afterward and expands to fill the media.
define(BOOT_PART_OFFSET, 2048)
define(BOOT_PART_COUNT, 1048576)
define-eval(DATA_PART_OFFSET, "${BOOT_PART_OFFSET} + ${BOOT_PART_COUNT}")
define(DATA_PART_COUNT, 1048576)

meta-product = ${NERVES_FW_PRODUCT}
meta-description = ${NERVES_FW_DESCRIPTION}
meta-version = ${NERVES_FW_VERSION}
meta-platform = ${NERVES_FW_PLATFORM}
meta-architecture = ${NERVES_FW_ARCHITECTURE}
meta-author = ${NERVES_FW_AUTHOR}
meta-vcs-identifier = ${NERVES_FW_VCS_IDENTIFIER}
meta-misc = ${NERVES_FW_MISC}

mbr mbr {
    partition 0 {
        block-offset = ${BOOT_PART_OFFSET}
        block-count = ${BOOT_PART_COUNT}
        type = 0xc # FAT32 (LBA)
        boot = true
    }
    partition 1 {
        block-offset = ${DATA_PART_OFFSET}
        block-count = ${DATA_PART_COUNT}
        type = 0x83 # Linux
        expand = true
    }
}

file-resource authorized_keys {
    host-path = "${NERVES_SYSTEM}/images/authorized_keys"
}

file-resource hostname {
    host-path = "${NERVES_SYSTEM}/images/hostname"
}

file-resource nerves-provisioning.conf {
    host-path = "${NERVES_SYSTEM}/images/nerves-provisioning.conf"
}

file-resource factory_t31_ZMC6tiIDQN {
    host-path = "${NERVES_SYSTEM}/images/uImage.lzma"
}

file-resource rootfs_hack.squashfs {
    host-path = ${ROOTFS}
}

task complete {
    require-unmounted-destination = true

    on-init {
        mbr_write(mbr)
        fat_mkfs(${BOOT_PART_OFFSET}, ${BOOT_PART_COUNT})
        fat_setlabel(${BOOT_PART_OFFSET}, "ATOMCAM2")
    }

    on-resource authorized_keys { fat_write(${BOOT_PART_OFFSET}, "authorized_keys") }
    on-resource hostname { fat_write(${BOOT_PART_OFFSET}, "hostname") }
    on-resource nerves-provisioning.conf { fat_write(${BOOT_PART_OFFSET}, "nerves-provisioning.conf") }
    on-resource factory_t31_ZMC6tiIDQN { fat_write(${BOOT_PART_OFFSET}, "factory_t31_ZMC6tiIDQN") }
    on-resource rootfs_hack.squashfs { fat_write(${BOOT_PART_OFFSET}, "rootfs_hack.squashfs") }

    on-finish {
        # Force first-boot filesystem initialization even when reusing media.
        raw_memset(${DATA_PART_OFFSET}, 256, 0xff)
    }
}

task upgrade {
    require-partition-offset(0, ${BOOT_PART_OFFSET})
    require-partition-offset(1, ${DATA_PART_OFFSET})

    on-resource factory_t31_ZMC6tiIDQN { fat_write(${BOOT_PART_OFFSET}, "factory_t31_ZMC6tiIDQN") }
    on-resource rootfs_hack.squashfs { fat_write(${BOOT_PART_OFFSET}, "rootfs_hack.squashfs") }
}
