# Atom Cam 2 firmware packaging.
#
# The ADR 0006 handoff prototype contains:
#
# - partition 1: FAT boot and provisioning filesystem
# - partition 2: raw SquashFS application filesystem
# - partition 3: Linux application-data partition
#
# The protected initramfs mounts partition 1 and switch_roots into the
# immutable rootfs_hack.squashfs boot manager. The boot manager mounts the
# application filesystem from partition 2 and performs the second root handoff.
# Partition 3 is reserved for target-side initialization and mounting at /data.

require-fwup-version="1.0.0"

define(NERVES_FW_PRODUCT, "Nerves Firmware")
define(NERVES_FW_DESCRIPTION, "Atom Cam 2 Nerves firmware")
define(NERVES_FW_VERSION, "${NERVES_SDK_VERSION}")
define(NERVES_FW_PLATFORM, "atomcam2")
define(NERVES_FW_ARCHITECTURE, "mipsel")
define(NERVES_FW_AUTHOR, "nerves_system_atomcam2")

define(ROOTFS, "${NERVES_SYSTEM}/images/rootfs.squashfs")
define(BOOT_MANAGER, "${NERVES_SYSTEM}/images/atomcam2-boot-manager.squashfs")
define(BOOT_METADATA, "${MIX_BUILD_PATH}/nerves/images/atomcam2-boot-metadata.bin")

# Partition sizes use 512-byte blocks.
#
# Keep 512 MiB for the protected kernel, boot manager, and provisioning files.
# Reserve 128 MiB for the prototype application filesystem. The data partition
# starts immediately afterward and expands to fill the media.
# ADR 0006 reserves the final 16 unpartitioned blocks before partition 1
# for two independent 4096-byte rollback metadata records.
define(BOOT_METADATA_RECORD_BLOCK_COUNT, 8)
define(BOOT_METADATA_RECORD_A_OFFSET, 2032)
define(BOOT_METADATA_RECORD_B_OFFSET, 2040)
define(BOOT_PART_OFFSET, 2048)
define(BOOT_PART_COUNT, 1048576)
define-eval(APPLICATION_PART_OFFSET, "${BOOT_PART_OFFSET} + ${BOOT_PART_COUNT}")
define(APPLICATION_PART_COUNT, 262144)
define-eval(DATA_PART_OFFSET, "${APPLICATION_PART_OFFSET} + ${APPLICATION_PART_COUNT}")
define(DATA_PART_COUNT, 1048576)

meta-product = ${NERVES_FW_PRODUCT}
meta-description = ${NERVES_FW_DESCRIPTION}
meta-version = ${NERVES_FW_VERSION}
meta-platform = ${NERVES_FW_PLATFORM}
meta-architecture = ${NERVES_FW_ARCHITECTURE}
meta-author = ${NERVES_FW_AUTHOR}
meta-vcs-identifier = ${NERVES_FW_VCS_IDENTIFIER}
meta-misc = ${NERVES_FW_MISC}

mbr mbr {
    partition 0 {
        block-offset = ${BOOT_PART_OFFSET}
        block-count = ${BOOT_PART_COUNT}
        type = 0xc # FAT32 (LBA)
        boot = true
    }
    partition 1 {
        block-offset = ${APPLICATION_PART_OFFSET}
        block-count = ${APPLICATION_PART_COUNT}
        type = 0x83 # Linux
    }
    partition 2 {
        block-offset = ${DATA_PART_OFFSET}
        block-count = ${DATA_PART_COUNT}
        type = 0x83 # Linux
        expand = true
    }
}

file-resource authorized_keys {
    host-path = "${NERVES_SYSTEM}/images/authorized_keys"
}

file-resource hostname {
    host-path = "${NERVES_SYSTEM}/images/hostname"
}

file-resource nerves-provisioning.conf {
    host-path = "${NERVES_SYSTEM}/images/nerves-provisioning.conf"
}

file-resource factory_t31_ZMC6tiIDQN {
    host-path = "${NERVES_SYSTEM}/images/uImage.lzma"
}

file-resource rootfs_hack.squashfs {
    host-path = ${BOOT_MANAGER}
}

file-resource rootfs.img {
    host-path = ${ROOTFS}
    assert-size-lte = ${APPLICATION_PART_COUNT}
}

file-resource boot-metadata-a {
    host-path = ${BOOT_METADATA}
    assert-size-lte = ${BOOT_METADATA_RECORD_BLOCK_COUNT}
}

file-resource boot-metadata-b {
    host-path = ${BOOT_METADATA}
    assert-size-lte = ${BOOT_METADATA_RECORD_BLOCK_COUNT}
}

file-resource atomcam2-data-init {
    contents = "format-if-missing\n"
}

task complete {
    require-unmounted-destination = true

    on-init {
        mbr_write(mbr)
        fat_mkfs(${BOOT_PART_OFFSET}, ${BOOT_PART_COUNT})
        fat_setlabel(${BOOT_PART_OFFSET}, "ATOMCAM2")
    }

    on-resource authorized_keys { fat_write(${BOOT_PART_OFFSET}, "authorized_keys") }
    on-resource hostname { fat_write(${BOOT_PART_OFFSET}, "hostname") }
    on-resource nerves-provisioning.conf { fat_write(${BOOT_PART_OFFSET}, "nerves-provisioning.conf") }
    on-resource factory_t31_ZMC6tiIDQN { fat_write(${BOOT_PART_OFFSET}, "factory_t31_ZMC6tiIDQN") }
    on-resource rootfs_hack.squashfs { fat_write(${BOOT_PART_OFFSET}, "rootfs_hack.squashfs") }
    on-resource rootfs.img { raw_write(${APPLICATION_PART_OFFSET}) }

    on-resource boot-metadata-a {
        raw_write(${BOOT_METADATA_RECORD_A_OFFSET})
    }

    on-resource boot-metadata-b {
        raw_write(${BOOT_METADATA_RECORD_B_OFFSET})
    }

    on-resource atomcam2-data-init {
        fat_write(${BOOT_PART_OFFSET}, "atomcam2-data-init")
    }
}

# The handoff prototype supports complete host-side installation only. Keep the
# standard task name so attempted device-side updates fail with a clear message.
task upgrade {
    on-init {
        error("ADR 0006 boot-manager prototype supports complete installations only")
    }
}
